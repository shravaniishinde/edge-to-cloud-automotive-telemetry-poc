# Minimal Mosquitto config for local development/demo use only.
#
# allow_anonymous true: NO authentication and NO TLS. This is intentional
# and documented as a Phase 3 limitation (see docs/assumptions-and-limitations.md)
# -- this broker is for a developer's own machine talking to their own
# simulator, not anything exposed to a network. Real credential/TLS
# handling is Phase 5's job, when the gateway talks to AWS IoT Core
# instead of local Mosquitto.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
