name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # actions/setup-python provides its own isolated Python install, so
      # (unlike the externally-managed system Python used for local dev in
      # this project's sandbox) no --break-system-packages flag is needed
      # here.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
