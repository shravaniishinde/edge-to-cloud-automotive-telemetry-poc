name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # actions/setup-python provides its own isolated Python install, so
      # (unlike the externally-managed system Python used for local dev in
      # this project's sandbox) no --break-system-packages flag is needed
      # here.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Phase 3's edge_gateway/tests/conftest.py spawns its own mosquitto
      # subprocess for the real-broker integration test -- installing the
      # binary here (rather than using a Docker service container) keeps
      # CI's setup identical to what a sandboxed dev environment without a
      # working Docker daemon can do. See docs/edge-gateway-spec.md.
      - name: Install Mosquitto broker
        run: sudo apt-get update && sudo apt-get install -y mosquitto

      - name: Run tests
        run: pytest -v
